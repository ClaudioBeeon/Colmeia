<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Colmeia — Gestão de tarefas Beeon</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Heebo:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
</head>
<body>

<div class="page" id="page">

  <aside class="sidebar">
    <nav class="sidebar-nav">
      <a href="#" class="nav-ic active" title="Kanban" data-page="kanban">
        <span class="nav-icon-circle"><svg viewBox="0 0 24 24" fill="none"><rect x="3" y="4" width="7" height="16" rx="2" stroke="currentColor" stroke-width="1.8"/><rect x="14" y="4" width="7" height="10" rx="2" stroke="currentColor" stroke-width="1.8"/></svg></span>
        <span class="nav-label">Kanban</span>
      </a>
      <a href="#" class="nav-ic" title="Meus clientes" data-page="clientes">
        <span class="nav-icon-circle"><svg viewBox="0 0 24 24" fill="none"><circle cx="12" cy="8" r="3.2" stroke="currentColor" stroke-width="1.8"/><path d="M5 20c0-3.6 3.1-6 7-6s7 2.4 7 6" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/></svg></span>
        <span class="nav-label">Meus clientes</span>
      </a>
      <a href="#" class="nav-ic" title="Clientes por atendimento" data-page="atendimento">
        <span class="nav-icon-circle"><svg viewBox="0 0 24 24" fill="none"><circle cx="8.5" cy="8" r="2.8" stroke="currentColor" stroke-width="1.8"/><circle cx="16" cy="9.5" r="2.2" stroke="currentColor" stroke-width="1.8"/><path d="M3 19c0-3 2.5-5 5.5-5s5.5 2 5.5 5" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/><path d="M14.5 14.3c2.4.3 4 2 4 4.7" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/></svg></span>
        <span class="nav-label">Clientes por atendimento</span>
      </a>
      <a href="#" class="nav-ic" title="Tipos de tarefas" data-page="tipos">
        <span class="nav-icon-circle"><svg viewBox="0 0 24 24" fill="none"><rect x="3" y="3" width="8" height="8" rx="1.8" stroke="currentColor" stroke-width="1.8"/><rect x="13" y="3" width="8" height="8" rx="1.8" stroke="currentColor" stroke-width="1.8"/><rect x="3" y="13" width="8" height="8" rx="1.8" stroke="currentColor" stroke-width="1.8"/><rect x="13" y="13" width="8" height="8" rx="1.8" stroke="currentColor" stroke-width="1.8"/></svg></span>
        <span class="nav-label">Tipos de tarefas</span>
      </a>
      <a href="#" class="nav-ic" title="Runrun completo" data-page="runrun">
        <span class="nav-icon-circle"><svg viewBox="0 0 24 24" fill="none"><rect x="3" y="3" width="18" height="18" rx="3" stroke="currentColor" stroke-width="1.8"/><path d="M3 9h18M9 9v12" stroke="currentColor" stroke-width="1.8"/></svg></span>
        <span class="nav-label">Runrun completo</span>
      </a>
      <a href="#" class="nav-ic" title="Minhas tarefas de hoje" data-page="hoje">
        <span class="nav-icon-circle"><svg viewBox="0 0 24 24" fill="none"><circle cx="12" cy="12" r="9" stroke="currentColor" stroke-width="1.8"/><path d="M12 7v5l3.5 2" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></svg></span>
        <span class="nav-label">Minhas tarefas de hoje</span>
      </a>
    </nav>

    <a href="#" class="nav-ic sidebar-profile-link" title="Claudio">
      <span class="nav-icon-circle avatar">CL</span>
      <span class="nav-label">Claudio</span>
    </a>
  </aside>

  <div class="main">

    <header class="topbar">
      <div>
        <h1 class="page-title">Quadro de tarefas</h1>
        <p class="page-subtitle">Time de design · Beeon</p>
      </div>

      <button type="button" class="now-playing" id="nowPlaying" hidden>
        <span class="now-playing-dot"></span>
        <span class="now-playing-title" id="nowPlayingTitle"></span>
        <span class="now-playing-time" id="nowPlayingTime"></span>
      </button>

      <div class="topbar-right">
        <div class="search-box">
          <svg viewBox="0 0 24 24" fill="none"><circle cx="11" cy="11" r="7" stroke="currentColor" stroke-width="1.8"/><path d="M21 21l-4-4" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/></svg>
          <input type="text" id="searchInput" placeholder="Buscar tarefa, cliente...">
        </div>

        <button type="button" class="icon-btn" id="notificationsBtn" title="Notificações do Runrun.it (em breve)">
          <svg viewBox="0 0 24 24" fill="none"><path d="M18 8a6 6 0 10-12 0c0 7-3 9-3 9h18s-3-2-3-9" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/><path d="M13.73 21a2 2 0 01-3.46 0" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/></svg>
        </button>

        <button type="button" class="icon-btn" id="quickAccessBtn" title="Acesso rápido">
          <svg viewBox="0 0 24 24" fill="none"><rect x="3" y="3" width="7" height="7" rx="1.5" stroke="currentColor" stroke-width="1.8"/><rect x="14" y="3" width="7" height="7" rx="1.5" stroke="currentColor" stroke-width="1.8"/><rect x="3" y="14" width="7" height="7" rx="1.5" stroke="currentColor" stroke-width="1.8"/><rect x="14" y="14" width="7" height="7" rx="1.5" stroke="currentColor" stroke-width="1.8"/></svg>
        </button>

        <div class="theme-switch" id="themeSwitch">
          <button class="on" data-mode="light" aria-label="Modo claro">
            <svg viewBox="0 0 24 24" fill="none"><circle cx="12" cy="12" r="4.5" stroke="currentColor" stroke-width="1.8"/><path d="M12 2.5v2M12 19.5v2M4.2 4.2l1.4 1.4M18.4 18.4l1.4 1.4M2.5 12h2M19.5 12h2M4.2 19.8l1.4-1.4M18.4 5.6l1.4-1.4" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/></svg>
          </button>
          <button data-mode="dark" aria-label="Modo escuro">
            <svg viewBox="0 0 24 24" fill="none"><path d="M20 14.5A8.5 8.5 0 119.5 4a7 7 0 0010.5 10.5z" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round"/></svg>
          </button>
        </div>
      </div>
    </header>

    <aside class="quick-access-panel" id="quickAccessPanel">
      <div class="quick-access-header">
        <h3>Acesso rápido</h3>
        <button type="button" id="quickAccessClose" aria-label="Fechar">
          <svg viewBox="0 0 24 24" fill="none"><path d="M6 6l12 12M18 6L6 18" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/></svg>
        </button>
      </div>
      <div class="quick-access-body">
        <p class="quick-access-empty">Nenhum link cadastrado ainda.</p>
      </div>
    </aside>

    <section class="app-page" id="page-kanban">
      <section class="board" id="board"></section>
    </section>

    <section class="app-page" id="page-clientes" hidden>
      <div class="clients-grid" id="clientsGrid"></div>
    </section>

    <section class="app-page" id="page-atendimento" hidden>
      <div class="clients-grid" id="atendimentoGrid"></div>
    </section>

    <section class="app-page" id="page-tipos" hidden>
      <div class="clients-grid" id="tiposGrid"></div>
    </section>

    <section class="app-page placeholder-page" id="page-runrun" hidden>
      <div class="placeholder-box">
        <span>📋</span>
        <p>Em breve: todas as abas do Runrun reunidas aqui</p>
      </div>
    </section>

    <section class="app-page placeholder-page" id="page-hoje" hidden>
      <div class="placeholder-box">
        <span>⏱️</span>
        <p>Em breve: tarefas que você deu play hoje</p>
      </div>
    </section>

  </div>
</div>

<script src="script.js"></script>
</body>
</html>
