<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<title>Colmeia</title>
<script>
  /**
   * O Colmeia é uma SPA (site de página única) publicada no GitHub
   * Pages, que não tem servidor de verdade entendendo URLs como
   * /11503 ou /minhas-horas — são endereços que só fazem sentido pro
   * JavaScript do próprio app (ver js/roteador-url.js). Quando alguém
   * abre um link desses direto — colou no navegador, clicou vindo de
   * fora, ou até um F5 simples — não existe arquivo nenhum com esse
   * nome e o GitHub cai bem aqui, nesta página de "não encontrado".
   *
   * Esse script guarda o caminho que a pessoa queria (numa "encomenda"
   * de curta duração, só desta aba) e manda ela pro index.html de
   * verdade — que lê essa encomenda e abre a tarefa/página certa
   * sozinho. Ninguém percebe o pulo: é instantâneo.
   *
   * `new URL(".", location.href).pathname` acha a "pasta" onde este
   * 404.html está publicado, sem precisar saber o nome do repositório
   * escrito na mão — funciona tanto hoje (algo como
   * "/Colmeia/11503" → pasta "/Colmeia/") quanto depois que o domínio
   * colmeia.beeon.com.br entrar no ar (algo como "/11503" → pasta "/"),
   * sem precisar mudar este arquivo quando isso acontecer.
   *
   * ⚠️ ISSO SOBE UMA PASTA SÓ. Toda rota do app tem que ter UM pedaço
   * depois da base ("/11503", "/minhas-horas", "/aprovacoes"). Uma rota
   * de dois pedaços ("/aprovacoes/114526") viraria "/aprovacoes/", que
   * também não existe: o GitHub cai aqui de novo, e de novo, com a tela
   * piscando sem parar. Aconteceu de verdade em 2026-08-04. Parâmetro
   * extra vai na QUERY (?tarefa=114526), nunca como pedaço de caminho.
   *
   * O contador abaixo é o cinto de segurança: se por qualquer motivo o
   * destino não existir, a pessoa vai parar na raiz do site em vez de
   * ficar presa no laço. Ela perde a rota, mas o app abre.
   */
  /**
   * ANTES DE TUDO: o link de aprovação do cliente (2026-08-08).
   *
   * Ele tem DOIS pedaços — `/adn/11505-k7m2` — e não é uma rota do app:
   * quem atende é o `aprovar.html`, uma página solta, sem login. Subir uma
   * pasta (o que o resto deste arquivo faz) levaria pra "/adn/", que não
   * existe, e o GitHub cairia aqui de novo — o laço de agosto.
   *
   * Por isso ele é reconhecido e mandado DIRETO pro destino certo, sem
   * passar pela encomenda do sessionStorage. Isto aqui é o "servidor" que
   * o GitHub Pages não tem: este arquivo é servido pra qualquer endereço
   * que não existe, em qualquer profundidade, então é o único lugar do
   * site que consegue ler um caminho inventado e decidir o que fazer com
   * ele.
   *
   * O formato é `sigla/idDaTarefa-cadeado`: letras, barra, números, traço.
   * A regra abaixo é estreita de propósito — qualquer outro endereço de
   * dois pedaços continua caindo no caminho normal.
   *
   * ⚠️ NÃO USE `new URL(".", location.href)` PRA ACHAR A BASE AQUI. Ela
   * devolve a PASTA do endereço atual, não a raiz do site: em
   * "/pdk/104590-z327" ela dá "/pdk/", e o código sobrava sem a sigla,
   * não casava com a regra, e a pessoa ia parar na tela inicial do
   * Colmeia (aconteceu de verdade em 2026-08-08). Funciona pro resto do
   * arquivo porque toda ROTA DO APP tem um pedaço só — o link de
   * aprovação é o único com dois.
   *
   * Por isso a base sai da PRÓPRIA regra: o que vem antes do código é a
   * base, seja "/" (domínio próprio) ou "/Colmeia/" (o endereço antigo do
   * GitHub Pages). Continua sem nome de repositório escrito na mão.
   */
  var casouAprovacao = location.pathname.match(/^(.*\/)([a-z0-9]{2,6}\/\d+-[a-z0-9]{3,8})$/i);

  // O `else` é obrigatório, não é estilo: `location.replace` NÃO
  // interrompe o script — sem ele, o desvio do fim do arquivo rodaria
  // logo em seguida e escreveria por cima do destino da aprovação.
  if (casouAprovacao) {
    location.replace(location.origin + casouAprovacao[1] + "aprovar.html?c=" + encodeURIComponent(casouAprovacao[2]));
  } else {
    try {
      sessionStorage.setItem("colmeiaRotaPendente", location.pathname + location.search + location.hash);
    } catch (e) {
      // Sem sessionStorage (aba anônima bem restrita, por exemplo) a
      // pessoa só cai na tela inicial normal, sem a tarefa/página abrindo
      // sozinha — não trava nada.
    }

    // Aqui `new URL(".", ...)` é o certo: toda ROTA DO APP tem um pedaço
    // só ("/11503", "/minhas-horas"), então a pasta de cima é mesmo a base.
    var destino = new URL(".", location.href).pathname;
    try {
      var voltas = Number(sessionStorage.getItem("colmeiaBounce404") || 0) + 1;
      sessionStorage.setItem("colmeiaBounce404", String(voltas));
      // Duas passagens por aqui já significam que o destino calculado
      // também não existe — não adianta tentar uma terceira.
      if (voltas > 2) {
        sessionStorage.removeItem("colmeiaBounce404");
        sessionStorage.removeItem("colmeiaRotaPendente");
        destino = "/";
      }
    } catch (e) {
      // Sem sessionStorage não dá pra contar as voltas; segue o caminho
      // normal, que é o que já acontecia antes deste cinto existir.
    }
    location.replace(destino);
  }
</script>
</head>
<body></body>
</html>
